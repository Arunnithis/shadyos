name: shady_os
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.6.1
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/

flutter_native_splash:
  color: "#0D1117"
  image: assets/images/splash.png

  android: true
  ios: true

  android_12:
    color: "#0D1117"
    image: assets/images/splash.png

  fullscreen: true

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/logo/logo.png"

  adaptive_icon_background: "#0B0D10"
  adaptive_icon_foreground: "assets/logo/logo.png"

  min_sdk_android: 21
  remove_alpha_ios: true